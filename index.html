<title>Marvel Watch Order</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0d12; --panel: #151922; --panel2: #1c2230; --text: #f4f5f7;
  --muted: #9da7b8; --red: #ed1d24; --border: #2b3240; --green: #67d99a;
  --gold: #f5c451; --blue: #6aa9ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
header { padding: 32px 20px 25px; background: linear-gradient(135deg, #45080d, #161923 65%); border-bottom: 1px solid var(--border); }
.container { max-width: 1200px; margin: auto; }
.eyebrow { color: #ff8589; text-transform: uppercase; letter-spacing: 3px; font-size: 12px; font-weight: 800; }
h1 { margin: 8px 0; font-size: clamp(30px, 5vw, 48px); }
header p { color: #c6cbd5; margin: 0; }
main { max-width: 1200px; margin: auto; padding: 22px 16px 60px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.stat, .controls, .item { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
.stat { padding: 16px; }
.stat strong { display: block; font-size: 26px; }
.stat span { color: var(--muted); font-size: 13px; }
.progress { height: 7px; background: #303746; border-radius: 99px; overflow: hidden; margin-top: 10px; }
.progress div { height: 100%; width: 0; background: var(--green); transition: width .2s; }
.controls { padding: 14px; margin-bottom: 14px; }
.filters { display: grid; grid-template-columns: 2fr 1.4fr 1.2fr 1fr; gap: 10px; }
input, select, button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-width: 0; }
button { cursor: pointer; }
button:hover { border-color: var(--red); }
button.primary { background: var(--red); border-color: var(--red); }
.section-title { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin: 28px 0 10px; font-weight: 700; }
.section-title span:last-child { white-space: nowrap; letter-spacing: 1px; }
.item { display: grid; grid-template-columns: 50px minmax(0,1fr) auto; gap: 13px; padding: 14px; margin-bottom: 9px; align-items: start; }
.number { background: #252b38; color: #cbd2df; border-radius: 8px; padding: 9px 4px; text-align: center; font-weight: 800; font-size: 14px; }
.number small { display: block; font-size: 9px; letter-spacing: 1px; color: var(--muted); margin-top: 3px; }
.item h3 { margin: 0 0 6px; font-size: 16px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; align-items: center; }
.tag { font-size: 11px; border: 1px solid #424a5a; color: #c4ccda; border-radius: 99px; padding: 3px 8px; }
.tag.essential { color: var(--gold); border-color: #6b5a25; }
.tag.recommended { color: var(--blue); border-color: #2f4c78; }
.tag.optional { color: var(--muted); }
.notes { color: var(--muted); font-size: 13px; line-height: 1.5; }
.actions { display: flex; gap: 6px; align-items: center; }
.actions button { font-size: 12px; padding: 7px 10px; text-decoration: none; color: var(--text); background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; }
.actions button.on-w { background: var(--green); border-color: var(--green); color: #07140d; }
.actions button.on-s { background: #5a2226; border-color: var(--red); }
.item.watched { opacity: .6; }
.item.watched h3 { text-decoration: line-through; }
.item.skipped { opacity: .4; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
@media(max-width:800px) {
  .filters { grid-template-columns: 1fr 1fr; }
  .filters input { grid-column: 1 / -1; }
  .item { grid-template-columns: 42px minmax(0,1fr); }
  .actions { grid-column: 2; }
}
@media(max-width:420px) {
  .stats { gap: 6px; } .stat { padding: 10px; } .stat strong { font-size: 21px; }
  .filters { grid-template-columns: 1fr; } .filters input { grid-column: auto; }
}
</style>
</head>

</main>

S|The Punisher: One Last Kill|O|8.3|May 12 2026
F|Spider-Man: Brand New Day|E|8.0|
T|VisionQuest (Season 1)|R||8 eps · Watch WandaVision and Agatha All Along first.
F|The Fantastic Four: First Steps|E|7.0|
F|Avengers: Doomsday|E||
`;

const KINDS = { F: "FILM", T: "TV", S: "SPC" };
const IMPS = {
  E: { cls: "essential", label: "★ ESSENTIAL TO THE MCU" },
  R: { cls: "recommended", label: "◆ RECOMMENDED FOR THE MCU" },
  O: { cls: "optional", label: "○ OPTIONAL TO THE MCU" }
};

function parseCatalog(raw) {
  const out = [];
  let section = "";
  const mk = (kind, title, imp, rating, note) => out.push({
    kind, title, imp, rating, note, section
  });
  for (const line of raw.split("\n")) {
    const l = line.trim();
    if (!l) continue;
    if (l[0] === "#") { section = l.slice(1).trim(); continue; }
    const p = l.split("|");
    if (p[0] === "@") {
      const [, title, imp, rating, eps, label] = p;
      let start = 1, list = eps;
      if (eps.includes(":")) { const s = eps.split(":"); start = Number(s[0]); list = s[1]; }
      list.split(",").forEach((n, i) =>
        mk("T", `${title} (Season ${start + i})`, imp, rating, `${n} ${label}`));
    } else {
      const [kind, title, imp, rating, note] = p;
      mk(kind, title, imp, rating, note);
    }
  }
  return out;
}

const base = parseCatalog(RAW);
const KEY = "marvel-watch-order-v2";
const $ = id => document.getElementById(id);
const els = {
  search: $("search"), section: $("section"), importance: $("importance"), status: $("status"),
  results: $("results"), total: $("total"), watched: $("watched"), percent: $("percent"), bar: $("progressBar")
};

let watched = new Set(), skipped = new Set();
let queued = false;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s) {
      watched = new Set(s.watched || []);
      skipped = new Set(s.skipped || []);
    }
  } catch (e) {}
}
function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ watched: [...watched], skipped: [...skipped] }));
  } catch (e) { console.warn("Could not save progress:", e); }
}
function schedule() {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => { queued = false; render(); });
}

const ESC = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ESC[c]);

let cache = new WeakMap();
function searchText(item) {
  let t = cache.get(item);
  if (t === undefined) {
    t = [item.title, item.note, item.section].join(" ").toLowerCase();
    cache.set(item, t);
  }
  return t;
}

let sectionKey = "";
function populateSections(items) {
  const names = [...new Set(items.map(x => x.section))];
  const key = names.join("\u0000");
  if (key === sectionKey) return;
  sectionKey = key;
  const cur = els.section.value;
  els.section.innerHTML = '<option value="">All sections</option>' +
    names.map(n => `<option>${esc(n)}</option>`).join("");
  els.section.value = names.includes(cur) ? cur : "";
}

function render() {
  const items = base;
  populateSections(items);

  const q = els.search.value.toLowerCase().trim();
  const sec = els.section.value, imp = els.importance.value, st = els.status.value;

  // Overall stats
  const skippedCount = items.reduce((n, _, i) => n + (skipped.has(i) ? 1 : 0), 0);
  const watchedCount = items.reduce((n, _, i) => n + (watched.has(i) ? 1 : 0), 0);
  const denom = items.length - skippedCount;
  const pct = denom > 0 ? Math.round(watchedCount / denom * 100) : 0;
  els.total.textContent = items.length;
  els.watched.textContent = watchedCount;
  els.percent.textContent = pct + "%";
  els.bar.style.width = pct + "%";

  // Per-section totals (all entries in section, regardless of filters)
  const secTotal = {}, secDone = {};
  items.forEach((it, i) => {
    secTotal[it.section] = (secTotal[it.section] || 0) + 1;
    if (watched.has(i)) secDone[it.section] = (secDone[it.section] || 0) + 1;
  });

  const visible = [];
  items.forEach((it, i) => {
    if (q && !searchText(it).includes(q)) return;
    if (sec && it.section !== sec) return;
    if (imp && it.imp !== imp) return;
    if (st === "watched" && !watched.has(i)) return;
    if (st === "skipped" && !skipped.has(i)) return;
    if (st === "unwatched" && (watched.has(i) || skipped.has(i))) return;
    visible.push(i);
  });

  if (!visible.length) {
    els.results.innerHTML = '<div class="empty">No entries match your filters.</div>';
    return;
  }

  let prev = null;
  const parts = [];
  for (const i of visible) {
    const it = items[i];
    if (it.section !== prev) {
      prev = it.section;
      parts.push(`<div class="section-title"><span>${esc(it.section)}</span><span>${secDone[it.section] || 0} / ${secTotal[it.section]} TITLES</span></div>`);
    }
    const w = watched.has(i), s = skipped.has(i);
    const impInfo = IMPS[it.imp];
    parts.push(`
      <article class="item ${w ? "watched" : ""} ${s ? "skipped" : ""}">
        <div class="number">${i + 1}<small>${KINDS[it.kind] || ""}</small></div>
        <div>
          <h3>${esc(it.title)}</h3>
          <div class="meta">
            ${impInfo ? `<span class="tag ${impInfo.cls}">${impInfo.label}</span>` : ""}
            ${it.rating ? `<span class="tag">★ ${esc(it.rating)}</span>` : ""}
          </div>
          ${it.note ? `<div class="notes">${esc(it.note)}</div>` : ""}
        </div>
        <div class="actions">
          <button data-act="w" data-i="${i}" class="${w ? "on-w" : ""}" title="Watched" aria-label="Mark watched">✓</button>
          <button data-act="s" data-i="${i}" class="${s ? "on-s" : ""}" title="Skip" aria-label="Skip">✕</button>
        </div>
      </article>`);
  }
  els.results.innerHTML = parts.join("");
}

els.results.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const i = Number(b.dataset.i);
  if (b.dataset.act === "w") {
    if (watched.has(i)) watched.delete(i); else { watched.add(i); skipped.delete(i); }
  } else {
    if (skipped.has(i)) skipped.delete(i); else { skipped.add(i); watched.delete(i); }
  }
  persist();
  schedule();
});

let timer;
els.search.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(schedule, 120); });
["section", "importance", "status"].forEach(id => $(id).addEventListener("change", schedule));

load();
render();
</script>
</body>
</html>
